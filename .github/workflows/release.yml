# ==============================================================================
# Sokuto 自動リリース & 配布ワークフロー
#
# Git タグ (v*.*.*) のプッシュまたは手動実行を契機に,
# 1. クロスプラットフォーム・ネイティブバイナリのビルド (Linux x86_64/arm64, macOS Apple Silicon)
# 2. ONNX Runtime (libonnxruntime) 共有ライブラリの自動バンドル & rpath 設定
# 3. Docker Buildx による Multi-Arch コンテナイメージ (linux/amd64, linux/arm64) の GHCR プッシュ
# 4. GitHub Releases へのスタンドアロンアーカイブ・Compose・モデル取得スクリプト・SHA256SUMS 公開
# を全自動で実行する。
# ==============================================================================

name: Release and Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'リリースバージョンタグ (例: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------------
  # 1. クロスプラットフォーム・ネイティブバイナリのビルドマトリクス
  # ----------------------------------------------------------------------------
  matrix-build:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: amd64
            use_cross: false

          # Linux aarch64 (ARM64 / AWS Graviton)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: arm64
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64
            use_cross: false

    steps:
      - name: ソースコードのチェックアウト
        uses: actions/checkout@v4

      - name: バージョン名の決定
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "${VERSION}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: ビルド必須ツールのインストール (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            clang \
            pkg-config \
            libssl-dev \
            libstdc++6

      - name: クロスコンパイラのセットアップ (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Rust ツールチェーンのセットアップ
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo ビルドキャッシュの復元
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: sokuto CLI バイナリのビルド
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p sokuto-cli --target ${{ matrix.target }}
          else
            cargo build --release -p sokuto-cli --target ${{ matrix.target }}
          fi

      - name: 配布アーカイブおよび共有ライブラリの収集
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          PKG_NAME="sokuto-${VERSION}-${{ matrix.target }}"
          DIST_DIR="dist/${PKG_NAME}"
          mkdir -p "${DIST_DIR}/bin"
          mkdir -p "${DIST_DIR}/lib"

          # 1. バイナリの配置
          cp "target/${{ matrix.target }}/release/sokuto" "${DIST_DIR}/bin/"
          chmod +x "${DIST_DIR}/bin/sokuto"

          # 2. ONNX Runtime 共有ライブラリの抽出
          # ort クレートがダウンロードまたは配置した共有ライブラリを探索
          find target -name "libonnxruntime*.so*" -exec cp -a {} "${DIST_DIR}/lib/" \; 2>/dev/null || true
          find target -name "libonnxruntime*.dylib" -exec cp -a {} "${DIST_DIR}/lib/" \; 2>/dev/null || true

          # 共有ライブラリがビルド成果物に見つからない場合の公式フォールバック取得
          if [ -z "$(ls -A "${DIST_DIR}/lib" 2>/dev/null)" ]; then
            echo "[INFO] target 内に libonnxruntime が見つからないため、公式リリース資産をダウンロードします..."
            ORT_VERSION="1.20.1"
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
              curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" | tar -xz -C /tmp/
              cp -a /tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so* "${DIST_DIR}/lib/"
            elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-aarch64-${ORT_VERSION}.tgz" | tar -xz -C /tmp/
              cp -a /tmp/onnxruntime-linux-aarch64-${ORT_VERSION}/lib/libonnxruntime.so* "${DIST_DIR}/lib/"
            elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
              curl -sSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" | tar -xz -C /tmp/
              cp -a /tmp/onnxruntime-osx-arm64-${ORT_VERSION}/lib/libonnxruntime*.dylib "${DIST_DIR}/lib/"
            fi
          fi

          # 3. 補助ファイル (Compose, モデル取得スクリプト, ドキュメント) の配置
          cp docker-compose.yml "${DIST_DIR}/"
          cp scripts/download_models.sh "${DIST_DIR}/"
          chmod +x "${DIST_DIR}/download_models.sh"
          cat << 'EOF' > "${DIST_DIR}/README.md"
          # Sokuto スタンドアロンバイナリパッケージ

          本パッケージには `bin/sokuto` 実行バイナリと、必要な `lib/` 共有ライブラリが同梱されています。
          rpath が設定されているため、アーカイブを展開して即座に実行可能です。

          ## 1. モデル成果物の取得 (Hugging Face Hub)

          推論を行うには、最適化済みモデル（ONNX / トークナイザー / 較正設定）が必要です。
          同梱の `download_models.sh` を用いて Hugging Face Hub より取得してください。

          ```bash
          # 推奨: Tier 2 (310M-INT8) モデルの取得 (保存先: ./models/modernbert-310m-int8)
          ./download_models.sh tier2

          # (任意) Tier 1 (130M-INT8) モデルの取得 (保存先: ./models/quantized)
          ./download_models.sh tier1
          ```

          公式 Hugging Face リポジトリ:
          - Tier 2 (標準高精度): https://huggingface.co/MI-1222/sokuto-ja-310m-int8
          - Tier 1 (低遅延):   https://huggingface.co/MI-1222/sokuto-ja-130m-int8

          ## 2. 実行例

          ```bash
          # ヘルプ確認
          ./bin/sokuto --help

          # (macOS でセキュリティ機能 Gatekeeper によりブロックされる場合)
          # xattr -d com.apple.quarantine ./bin/sokuto

          # サーバー起動 (Tier 2 モデルを指定)
          ./bin/sokuto serve --model-dir ./models/modernbert-310m-int8 --port 3000
          ```
          EOF

          # 4. tar.gz アーカイブおよび SHA256 チェックサムの生成
          tar -C dist -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: バイナリアーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            sokuto-*-${{ matrix.target }}.tar.gz
            sokuto-*-${{ matrix.target }}.tar.gz.sha256
          retention-days: 5

      # Docker ビルド用の中間バイナリ成果物の保存 (Linux のみ)
      - name: Docker 用バイナリ成果物のアップロード
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: docker-bin-${{ matrix.arch }}
          path: |
            dist/sokuto-*/bin/sokuto
            dist/sokuto-*/lib/libonnxruntime*
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 2. Multi-Arch Docker イメージのビルド & GHCR プッシュ (Buildx)
  # ----------------------------------------------------------------------------
  docker-multiarch-release:
    name: Build & Push Multi-Arch Docker Image
    needs: [matrix-build]
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードのチェックアウト
        uses: actions/checkout@v4

      - name: Docker 用バイナリ (amd64) のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: docker-bin-amd64
          path: tmp-amd64

      - name: Docker 用バイナリ (arm64) のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: docker-bin-arm64
          path: tmp-arm64

      - name: Docker ビルドコンテキストの組み立て
        run: |
          mkdir -p dist/bin/amd64 dist/lib/amd64
          mkdir -p dist/bin/arm64 dist/lib/arm64

          # amd64
          find tmp-amd64 -name "sokuto" -type f -exec cp {} dist/bin/amd64/ \;
          find tmp-amd64 -name "libonnxruntime*.so*" -exec cp -a {} dist/lib/amd64/ \;

          # arm64
          find tmp-arm64 -name "sokuto" -type f -exec cp {} dist/bin/arm64/ \;
          find tmp-arm64 -name "libonnxruntime*.so*" -exec cp -a {} dist/lib/arm64/ \;

          rm -rf tmp-amd64 tmp-arm64

      - name: Docker Buildx のセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR へのログイン認証
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker メタデータ (タグ・ラベル) の生成
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=cpu

      - name: Multi-Arch コンテナイメージのビルド & GHCR プッシュ (Dockerfile.dist)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 3. GitHub Releases への成果物集約と公開
  # ----------------------------------------------------------------------------
  publish-release:
    name: Publish Release Artifacts
    needs: [matrix-build, docker-multiarch-release]
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードのチェックアウト
        uses: actions/checkout@v4

      - name: バージョン名の決定
        id: vars
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "${VERSION}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 全バイナリアーティファクトのダウンロード
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: binary-*
          merge-multiple: true

      - name: モデル取得スクリプトの追加
        run: |
          cp scripts/download_models.sh release-artifacts/
          chmod +x release-artifacts/download_models.sh

      - name: 統合 SHA256SUMS の生成
        run: |
          cd release-artifacts
          shasum -a 256 sokuto-*.tar.gz download_models.sh > SHA256SUMS
          cat SHA256SUMS

      - name: リリースノート本文の生成
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          cat << EOF > release-body.md
          ## sokuto ${VERSION}

          日本語特化・TypeSafe AI「Jev (System One)」のローカル／オンプレミス推論基盤 \`sokuto\` の成果物リリースです。

          ### 📦 配布バイナリ & コンテナ
          - **スタンドアロンバイナリ**: 下記 Assets より対象 OS/Arch の \`sokuto-${VERSION}-*.tar.gz\` をダウンロードしてください (ONNX Runtime 共有ライブラリ同梱)。
          - **Multi-Arch Docker イメージ**: \`docker pull ghcr.io/${{ github.repository }}:${VERSION}\` (または \`latest\`)

          ### 🤗 Hugging Face Hub モデル成果物
          推論実行に必要な最適化済み ONNX モデル・較正設定は Hugging Face Hub で管理されています:
          - **Tier 2 (310M-INT8 / 推奨標準)**: [MI-1222/sokuto-ja-310m-int8](https://huggingface.co/MI-1222/sokuto-ja-310m-int8) (23ms, Choice 90.1%)
          - **Tier 1 (130M-INT8 / 低遅延)**: [MI-1222/sokuto-ja-130m-int8](https://huggingface.co/MI-1222/sokuto-ja-130m-int8) (12ms, Choice 87.8%)

          #### モデル取得スクリプト:
          \`\`\`sh
          # 添付の download_models.sh で自動取得
          ./download_models.sh tier2
          \`\`\`
          EOF

      - name: GitHub Release への成果物添付と公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          body_path: release-body.md
          files: |
            release-artifacts/sokuto-*.tar.gz
            release-artifacts/SHA256SUMS
            release-artifacts/download_models.sh
            docker-compose.yml
          draft: false
          prerelease: false
          generate_release_notes: true
