services:
  # ----------------------------------------------------------------------------
  # CPU 推論サービス (標準高精度: Tier 2 - 310M-INT8)
  # ----------------------------------------------------------------------------
  sokuto-cpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: sokuto:cpu
    container_name: sokuto-cpu
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SOKUTO_HOST=0.0.0.0
      - SOKUTO_PORT=3000
      - SOKUTO_MODEL_DIR=/models/default
      - SOKUTO_POOL_SIZE=2
      - SOKUTO_INTRA_THREADS=4
      - SOKUTO_INTER_THREADS=1
      - RUST_LOG=sokuto_server=info,sokuto_cli=info,tower_http=info
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models/modernbert-310m-int8:/models/default:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/sokuto", "healthcheck", "--url", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1G
        reservations:
          cpus: "1.0"
          memory: 512M

  # ----------------------------------------------------------------------------
  # CPU 極小エッジ推論サービス (Tier 1 - 130M-INT8)
  # ----------------------------------------------------------------------------
  sokuto-tier1:
    profiles: ["tier1"]
    image: sokuto:cpu
    container_name: sokuto-tier1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - SOKUTO_HOST=0.0.0.0
      - SOKUTO_PORT=3000
      - SOKUTO_MODEL_DIR=/models/default
      - SOKUTO_POOL_SIZE=2
      - SOKUTO_INTRA_THREADS=2
      - SOKUTO_INTER_THREADS=1
      - RUST_LOG=sokuto_server=info,sokuto_cli=info,tower_http=info
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models/quantized:/models/default:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/sokuto", "healthcheck", "--url", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # ----------------------------------------------------------------------------
  # All-in-One 自己完結型サービス (モデル内包・マウント不要)
  # ----------------------------------------------------------------------------
  sokuto-allinone:
    profiles: ["allinone"]
    build:
      context: .
      dockerfile: docker/Dockerfile.allinone
      args:
        MODEL_TIER: tier2
    image: sokuto:allinone-tier2
    container_name: sokuto-allinone
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - SOKUTO_HOST=0.0.0.0
      - SOKUTO_PORT=3000
      - SOKUTO_POOL_SIZE=2
      - SOKUTO_INTRA_THREADS=4
      - SOKUTO_INTER_THREADS=1
      - RUST_LOG=sokuto_server=info,sokuto_cli=info,tower_http=info
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    healthcheck:
      test: ["CMD", "/usr/local/bin/sokuto", "healthcheck", "--url", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G

  # ----------------------------------------------------------------------------
  # GPU 推論サービス (NVIDIA GPU 環境用, profile: gpu)
  # ----------------------------------------------------------------------------
  sokuto-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    image: sokuto:cuda
    container_name: sokuto-gpu
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - SOKUTO_HOST=0.0.0.0
      - SOKUTO_PORT=3000
      - SOKUTO_MODEL_DIR=/models/default
      - SOKUTO_POOL_SIZE=4
      - SOKUTO_PROVIDER=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - RUST_LOG=sokuto_server=info,sokuto_cli=info,tower_http=info
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models/modernbert-310m-int8:/models/default:ro
      - /tmp/ort_trt_cache:/tmp/ort_trt_cache
    healthcheck:
      test: ["CMD", "/usr/local/bin/sokuto", "healthcheck", "--url", "http://127.0.0.1:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
