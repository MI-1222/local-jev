# ==============================================================================
# Local-Jev 自動リリース & 配布ワークフロー
#
# Git タグ (v*.*.*) のプッシュまたは手動実行を契機に,
# 1. GHCR (GitHub Container Registry) への軽量 Docker イメージ Push.
# 2. GitHub Releases へのスタンドアロンバイナリ・Compose テンプレート・チェックサム公開.
# を全自動で実行する。
# ==============================================================================

name: Release and Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'リリースバージョンタグ (例: v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. GHCR (GitHub Packages) コンテナイメージのビルド & プッシュ
  # ----------------------------------------------------------------------------
  docker-release:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードのチェックアウト,
        uses: actions/checkout@v4

      - name: Docker Buildx のセットアップ,
        uses: docker/setup-buildx-action@v3

      - name: GHCR へのログイン認証,
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker メタデータ (タグ・ラベル) の生成,
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: CPU 推論コンテナイメージのビルド & GHCR プッシュ,
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # 2. スタンドアロンバイナリのビルド & GitHub Release 公開
  # ----------------------------------------------------------------------------
  binary-release:
    name: Build Binary & Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: ソースコードのチェックアウト,
        uses: actions/checkout@v4

      - name: ビルド必須ツールのインストール,
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            clang \
            pkg-config \
            libssl-dev \
            libstdc++6

      - name: Rust ツールチェーンのセットアップ,
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo ビルドキャッシュの復元,
        uses: Swatinem/rust-cache@v2

      - name: local-jev CLI バイナリのビルド,
        run: cargo build --release -p local-jev-cli

      - name: 配布アーカイブおよびチェックサムの作成,
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "${VERSION}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          fi

          RELEASE_DIR="local-jev-${VERSION}-linux-x86_64"
          mkdir -p "${RELEASE_DIR}"

          # バイナリおよび設定テンプレートの配置
          cp target/release/local-jev "${RELEASE_DIR}/"
          cp docker-compose.yml "${RELEASE_DIR}/"

          # tar.gz アーカイブ作成
          tar -czvf "${RELEASE_DIR}.tar.gz" "${RELEASE_DIR}"
          sha256sum "${RELEASE_DIR}.tar.gz" > "${RELEASE_DIR}.tar.gz.sha256"

      - name: GitHub Release への成果物添付と公開,
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: |
            local-jev-*.tar.gz
            local-jev-*.tar.gz.sha256
            docker-compose.yml
          draft: false
          prerelease: false
          generate_release_notes: true
