[project]
name = "local-jev-train"
version = "0.1.0"
description = "Jev train"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "marimo>=0.24.2",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "pyyaml>=6.0.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
markers = [
    "slow: 実行時間が長いテスト",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018"]
